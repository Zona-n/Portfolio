<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460" role="img" aria-label="Illustrated placeholder avatar">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1B1730"/>
      <stop offset="55%" stop-color="#231C3E"/>
      <stop offset="100%" stop-color="#152B2C"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8B7CFF"/>
      <stop offset="100%" stop-color="#5A48D6"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3A2E4F"/>
      <stop offset="100%" stop-color="#221A31"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="60%">
      <stop offset="0%"  stop-color="#8B7CFF" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity=".10"/>
    </pattern>
    <clipPath id="frame"><rect width="400" height="460" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- backdrop -->
    <rect width="400" height="460" fill="url(#bgG)"/>
    <rect width="400" height="460" fill="url(#dots)"/>
    <rect width="400" height="460" fill="url(#glow)"/>

    <!-- floating data motifs -->
    <g opacity=".55">
      <circle cx="52"  cy="76"  r="4"   fill="#37E0C4"/>
      <circle cx="348" cy="120" r="3"   fill="#8B7CFF"/>
      <circle cx="330" cy="60"  r="5.5" fill="#FFC34D" opacity=".8"/>
      <circle cx="66"  cy="300" r="3.5" fill="#8B7CFF"/>
      <circle cx="356" cy="316" r="4"   fill="#37E0C4"/>
      <path d="M28 152 L52 132 L74 142 L96 108" fill="none" stroke="#37E0C4" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
      <g fill="#8B7CFF" opacity=".6">
        <rect x="312" y="216" width="8" height="22" rx="3"/>
        <rect x="326" y="204" width="8" height="34" rx="3"/>
        <rect x="340" y="192" width="8" height="46" rx="3"/>
      </g>
    </g>

    <!-- shoulders / hoodie -->
    <path d="M62 460 C62 372 128 330 200 330 C272 330 338 372 338 460 Z" fill="url(#hoodie)"/>
    <path d="M62 460 C62 372 128 330 200 330 L200 460 Z" fill="#000" opacity=".08"/>

    <!-- hoodie collar -->
    <path d="M154 340 C168 372 232 372 246 340 C232 334 216 330 200 330 C184 330 168 334 154 340 Z"
          fill="#4B3AC4"/>
    <path d="M186 350 C186 384 186 400 190 414" fill="none" stroke="#EDEBFF" stroke-width="4" stroke-linecap="round" opacity=".85"/>
    <path d="M214 350 C214 384 214 400 210 414" fill="none" stroke="#EDEBFF" stroke-width="4" stroke-linecap="round" opacity=".85"/>
    <circle cx="190" cy="418" r="4.5" fill="#EDEBFF" opacity=".85"/>
    <circle cx="210" cy="418" r="4.5" fill="#EDEBFF" opacity=".85"/>

    <!-- little scatter-plot badge on the chest -->
    <g transform="translate(252 384)" opacity=".9">
      <rect x="0" y="0" width="46" height="40" rx="8" fill="#221A31" opacity=".55"/>
      <path d="M8 32 H38 M8 32 V8" stroke="#FFFFFF" stroke-width="1.4" opacity=".45" stroke-linecap="round"/>
      <circle cx="15" cy="25" r="2.4" fill="#37E0C4"/>
      <circle cx="22" cy="20" r="2.4" fill="#37E0C4"/>
      <circle cx="29" cy="21" r="2.4" fill="#FFC34D"/>
      <circle cx="34" cy="13" r="2.4" fill="#FFC34D"/>
      <path d="M11 28 L36 12" stroke="#8B7CFF" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- neck -->
    <path d="M176 268 H224 V318 C224 330 176 330 176 318 Z" fill="#D79E77"/>

    <!-- hair back -->
    <ellipse cx="200" cy="192" rx="78" ry="90" fill="url(#hair)"/>

    <!-- ears -->
    <circle cx="134" cy="206" r="12" fill="#E9B58F"/>
    <circle cx="266" cy="206" r="12" fill="#E9B58F"/>

    <!-- face -->
    <ellipse cx="200" cy="200" rx="64" ry="74" fill="#E9B58F"/>

    <!-- fringe -->
    <path d="M136 186 C140 126 166 106 200 106 C234 106 260 126 264 186
             C256 156 240 150 200 150 C160 150 144 156 136 186 Z" fill="url(#hair)"/>
    <path d="M136 186 C140 150 156 140 178 138 C160 148 150 164 146 190 Z" fill="#2B2141" opacity=".8"/>

    <!-- brows -->
    <path d="M164 178 Q180 170 196 177" fill="none" stroke="#2B2141" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M204 177 Q220 170 236 178" fill="none" stroke="#2B2141" stroke-width="4.5" stroke-linecap="round"/>

    <!-- glasses -->
    <g stroke="#37E0C4" stroke-width="3.4" fill="#FFFFFF" fill-opacity=".10">
      <rect x="146" y="188" width="46" height="36" rx="11"/>
      <rect x="208" y="188" width="46" height="36" rx="11"/>
    </g>
    <path d="M192 204 H208" stroke="#37E0C4" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M146 200 L132 204" stroke="#37E0C4" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M254 200 L268 204" stroke="#37E0C4" stroke-width="3.4" stroke-linecap="round"/>

    <!-- eyes -->
    <circle cx="169" cy="206" r="5.6" fill="#2B2141"/>
    <circle cx="231" cy="206" r="5.6" fill="#2B2141"/>
    <circle cx="171" cy="204" r="1.9" fill="#FFFFFF"/>
    <circle cx="233" cy="204" r="1.9" fill="#FFFFFF"/>

    <!-- blush -->
    <ellipse cx="156" cy="232" rx="13" ry="8" fill="#D9705F" opacity=".22"/>
    <ellipse cx="244" cy="232" rx="13" ry="8" fill="#D9705F" opacity=".22"/>

    <!-- nose -->
    <path d="M200 216 C204 228 204 234 198 236" fill="none" stroke="#C98C64" stroke-width="3" stroke-linecap="round"/>

    <!-- smile -->
    <path d="M180 246 Q200 262 220 246" fill="none" stroke="#8C4A3C" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
